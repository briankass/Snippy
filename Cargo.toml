[package]
name = "snippy"
version = "0.7.9"
edition = "2021"
description = "A tiny floating screen snipping and recording tool"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18"
xcap = "0.9"
# H.264 encoder (Cisco OpenH264, compiled from source) + MP4 muxer for screen recording
openh264 = "0.9"
mp4 = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"
# Update checks against GitHub Releases
ureq = { version = "3", features = ["json", "platform-verifier"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
# Media Foundation (H.264 + AAC MP4 writer), DWM (glass / rounded corners)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
] }
# System tray icon + menu
tray-icon = "0.26"
# Audio capture (WASAPI, incl. system-audio loopback)
cpal = "0.18"


[build-dependencies]
# Embeds the app icon + version info into snippy.exe
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
