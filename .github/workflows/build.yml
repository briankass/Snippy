name: Build

# Every push is built and tested on Windows.
# A push to `main` publishes a GitHub Release automatically when the version in Cargo.toml
# hasn't been released yet; just bump `version` and push.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        env:
          SNIPPY_MF_TEST_OUT: ${{ runner.temp }}\snippy-mf-test.mp4
        run: cargo test --release -- --nocapture

      - name: Upload Media Foundation test video
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mf-test-video
          path: ${{ runner.temp }}\snippy-mf-test.mp4
          if-no-files-found: ignore

      - name: Build
        run: cargo build --release

      - name: Upload snippy.exe (workflow artifact)
        uses: actions/upload-artifact@v5
        with:
          name: snippy-windows-x64
          path: target/release/snippy.exe

      - name: Read version from Cargo.toml
        id: ver
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Is this version already released?
        id: check
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release (new version on main)
        if: github.ref == 'refs/heads/main' && steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Snippy ${{ steps.ver.outputs.version }}
          files: target/release/snippy.exe
          generate_release_notes: true

      - name: Publish release (manually pushed tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/snippy.exe
          generate_release_notes: true
