name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Upload snippy.exe (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: snippy-windows-x64
          path: target/release/snippy.exe

      # Pushing a tag like v0.3.0 publishes a GitHub Release with snippy.exe attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/snippy.exe
          generate_release_notes: true
